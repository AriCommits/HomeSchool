# docker-compose.yml
# Security-hardened configuration
services:
  chromadb:
    image: chromadb/chroma:1.0.0   # pin the version for reproducibility
    ports:
      - "127.0.0.1:${HOST_CHROMA_PORT:-8000}:8000"     # Bind to localhost only - not exposed externally
    environment:
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_CORS_ALLOW_ORIGINS=["http://localhost"]
    volumes:
      - chroma_data:/data
      - ../config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    # Security: Run as non-root user (if Dockerfile supports it)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      retries: 3
      start_period: 5s
      timeout: 10s

  sync_worker:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBED_MODEL_PATH=/models/nomic-embed-text-v1.5.Q4_K_M.gguf
      - SYNC_DATABASE=${SYNC_DATABASE:-default}
      - HOMESCHOOL_IN_CONTAINER=1
      - HOMESCHOOL_VAULT_PATH=/vault
      - HOMESCHOOL_MODEL_STORE=/models
      - HOMESCHOOL_MANIFEST_DIR=/app/manifest
      - HF_HOME=/app/manifest/hf
      - TRANSFORMERS_CACHE=/app/manifest/hf/transformers
      - SENTENCE_TRANSFORMERS_HOME=/app/manifest/hf/sentence_transformers
      - TORCH_HOME=/app/manifest/hf/torch
      # Security: Don't pass sensitive credentials via environment variables
      # Instead, use Docker secrets or mounted credentials
    volumes:
       # Security: Added noexec,nosuid,nodev to prevent privilege escalation
        - ${VAULT_PATH}:/vault:ro,noexec,nosuid,nodev
        - ${MODEL_STORE}:/models:ro,noexec,nosuid,nodev
        - sync_manifest:/app/manifest
        - ../config.yaml:/app/config.yaml:ro
    depends_on:
      chromadb:
        condition: service_healthy
    profiles:
      - sync    # only runs when explicitly called, not on `compose up`
    restart: unless-stopped
    # Security: Prevent container from gaining additional privileges
    security_opt:
      - no-new-privileges:true
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    # Security: Limit resources to prevent DoS
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://chromadb:8000/api/v2/heartbeat', timeout=5).read()"]
      interval: 30s
      retries: 3
      start_period: 40s
      timeout: 10s

volumes:
  chroma_data:
  sync_manifest:

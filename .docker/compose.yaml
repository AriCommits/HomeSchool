# docker-compose.yml
services:
 
   chromadb:
     image: chromadb/chroma:0.5.0   # pin the version for reproducibility
     ports:
       - "127.0.0.1:8000:8000"
     environment:
       - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_TOKEN}
       - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
       - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
       - ANONYMIZED_TELEMETRY=false
       - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["http://localhost"]
     volumes:
       - chroma_data:/chroma/chroma
       - ../../config.yaml:/app/config.yaml:ro  # Mount config for database selection
     restart: unless-stopped
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
       interval: 10s
       retries: 3
       start_period: 5s
       timeout: 10s
 
   sync_worker:
     build: .        # your Dockerfile lives here
     environment:
       - CHROMA_TOKEN=${CHROMA_TOKEN}
       - CHROMA_HOST=chromadb
       - CHROMA_PORT=8000
       - EMBED_MODEL_PATH=/models/nomic-embed-text-v1.5.Q4_K_M.gguf
       - SYNC_DATABASE=${SYNC_DATABASE:-default}  # Database selection with default fallback
     volumes:
       - ${VAULT_PATH}:/vault:ro           # read-only vault bind mount
       - ${MODEL_STORE}:/models:ro         # your local ModelStore
       - sync_manifest:/app/manifest       # persistent manifest DB
       - ../../config.yaml:/app/config.yaml:ro  # Mount config for database-specific settings
     depends_on:
       chromadb:
         condition: service_healthy
     profiles:
       - sync    # only runs when explicitly called, not on `compose up`
     restart: unless-stopped
     healthcheck:
       test: ["CMD", "python", "-c", "try:\n import requests\n r = requests.get('http://chromadb:8000/api/v1/heartbeat', timeout=5)\n r.raise_for_status()\nexcept:\n sys.exit(1)"]
       interval: 30s
       retries: 3
       start_period: 40s
       timeout: 10s
 
volumes:
   chroma_data:
   sync_manifest:
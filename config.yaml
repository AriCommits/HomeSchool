# Homeschool Configuration
# Generated by: python -m homeschool setup

hardware:
  gpu: "cpu"

network:
  bind_host: "localhost"
  ports:
    chromadb: 8000

paths:
  vault: "/private/tmp/test_vault"
  model_store: "/private/tmp/test_models"
  manifest_dir: null

embedding:
  model_file: "nomic-embed-text-v1.5.Q4_K_M.gguf"
  n_ctx: 512
  n_gpu_layers: 32
  split_headers:
    - "#"
    - "##"
    - "###"
  embed_batch_size: 32

chromadb:
  collection_name: "mcat"
  distance_metric: "cosine"
  auth_token: "CHANGE_ME"

databases:
  default:
    vault_subpath: ""
    collection: "homeschool"
  essay:
    vault_subpath: "essays"
    collection: "essay_collection"
  homework:
    vault_subpath: "homework"
    collection: "homework_collection"

sync:
  exclude_patterns:
    - "**/*.tmp"
    - "**/*.log"
    - "**/.git/**"
  prune_deleted: true
  embed_batch_size: 32

jan:
  base_url: "http://localhost:1337/v1"
  inference_model: "Jan-v3.5-4B-Q4_K_XL"
  embedding_model: "Nomic_embedding"

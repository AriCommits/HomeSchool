# Homeschool Configuration
# Copy this file to config.yaml and customize the values

hardware:
  gpu: "cpu"  # Options: cpu, nvidia, metal

network:
  bind_host: "localhost"
  ports:
    chromadb: 8000

paths:
  vault: "/tmp/test_vault"
  model_store: "/tmp/test_model_store"
  manifest_dir: null  # Uses default: ~/.sovereign_brain/manifest

embedding:
  model_file: "nomic-embed-text-v1.5.Q4_K_M.gguf"
  n_ctx: 512
  n_gpu_layers: 32
  split_headers:
    - "#"
    - "##"
    - "###"
  embed_batch_size: 32

chromadb:
  collection_name: "homeschool"  # Default collection for backward compatibility
  distance_metric: "cosine"
  auth_token: "a45c6052e606020ab8a3e067ec1c9230aaf71517d71daa1afd5af17b7d4409eb"  # Generated secret

# Database configurations - each database maps to a ChromaDB collection
databases:
  default:  # Used when no database specified
    vault_subpath: ""  # Sync entire vault
    collection: "homeschool"
  essay:
    vault_subpath: "essays"  # Sync only essays subdirectory
    collection: "essay_collection"
  homework:
    vault_subpath: "homework"
    collection: "homework_collection"

sync:
  exclude_patterns:
    - "**/*.tmp"
    - "**/*.log"
    - "**/.git/**"
  prune_deleted: true
  embed_batch_size: 32

jan:
  base_url: "http://localhost:1337"
  inference_model: "nemotron-3-super"
  embedding_model: "nomic-embed-text"
